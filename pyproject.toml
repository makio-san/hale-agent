[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hale-agent"
version = "0.1.0"
description = "Hale: a preregistered, human-gated research agent for the Helio24 solar flare forecasting project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Esma Karaca" }]
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hale = "hale.cli:main"

[tool.setuptools.packages.find]
include = ["hale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
